# Duo Launcher is the home screen: show the logo, then release the screen instead of waiting
# for the stock launcher (fb_load --keep-open only lets go when APPLaunch's binary runs).
# Undo: rm -r /etc/systemd/system/fb_load.service.d && systemctl daemon-reload
[Service]
ExecStart=
ExecStart=/usr/sbin/fb_load
