# The Cardputer has no local login seat (Duo Launcher runs as a background user service), and
# WirePlumber only enables Bluetooth audio for a user with an active local seat. Turn that check
# off so the Cardputer can stream music to Bluetooth speakers and car stereos.
# Undo: delete this file and run: systemctl --user restart wireplumber
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
